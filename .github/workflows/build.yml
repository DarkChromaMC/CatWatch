name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      VERSION: 0.1.${{ github.run_number }}
      BUILD: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Run unit tests
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devs = json.load(sys.stdin)["devices"]
          ios = sorted((k for k in devs if "iOS" in k), reverse=True)
          print(next(d["udid"] for k in ios for d in devs[k] if d["name"].startswith("iPhone")))')
          echo "Testing on simulator $UDID"
          xcodebuild test -project CatWatch.xcodeproj -scheme CatWatch \
            -destination "id=$UDID" CODE_SIGNING_ALLOWED=NO -quiet

      - name: Build unsigned IPA
        run: |
          xcodebuild build -project CatWatch.xcodeproj -scheme CatWatch \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD" -quiet
          mkdir -p dist/Payload
          cp -R build/Build/Products/Release-iphoneos/CatWatch.app dist/Payload/
          (cd dist && zip -qry CatWatch.ipa Payload)
          cp CatWatch/Assets.xcassets/AppIcon.appiconset/icon-1024.png dist/icon.png
          python3 scripts/make_altstore_source.py dist/CatWatch.ipa "$VERSION" "$BUILD" "${{ github.repository }}" > dist/source.json

      - uses: actions/upload-artifact@v4
        with:
          name: CatWatch-${{ env.VERSION }}
          path: dist/CatWatch.ipa

      - name: Publish release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" dist/CatWatch.ipa dist/source.json dist/icon.png \
            --title "CatWatch $VERSION" --notes "Build $BUILD from ${GITHUB_SHA::7}" --latest
